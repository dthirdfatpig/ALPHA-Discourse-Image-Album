en:
  site_settings:
    image_album_enabled: "Enable or disable the Discourse Image Album plugin."
    image_album_max_images_per_album: "Maximum number of pictures allowed in a single album (supports 5,000+ images per album)."
    image_album_max_total_images_per_user: "Maximum total pictures a single user can store across all of their albums."
    image_album_max_disk_quota_mb: "Maximum disk space quota (in Megabytes) per user for photo albums. Set to 0 for unlimited."
    image_album_allow_sub_albums: "Allow users to organize pictures into nested sub-albums."
    image_album_max_album_depth: "Maximum hierarchy nesting depth allowed for sub-albums."
    image_album_max_albums_per_user: "Maximum total number of albums and sub-albums a user can create."
    image_album_enable_whole_album_download: "Allow users to download an entire photo album as a compressed ZIP file."
    image_album_min_trust_level_to_use: "Minimum trust level required to view and use personal photo albums."
    image_album_max_images_tl0: "Maximum total pictures allowed for Trust Level 0 users."
    image_album_max_images_tl1: "Maximum total pictures allowed for Trust Level 1 users."
    image_album_max_images_tl2: "Maximum total pictures allowed for Trust Level 2 users."
    image_album_max_images_tl3: "Maximum total pictures allowed for Trust Level 3 users."
    image_album_max_images_tl4: "Maximum total pictures allowed for Trust Level 4 users."
    image_album_allow_admin_custom_quotas: "Allow site administrators to define custom quota overrides for individual users."
    image_album_max_bulk_selection: "Maximum number of pictures selectable in a single bulk operation."
    image_album_allow_external_hotlinks: "Allow bookmarking and saving external image URLs directly into albums."

  discourse_image_album:
    errors:
      plugin_disabled: "The Image Album plugin is currently disabled."
      unauthorized: "You do not have permission to access or modify this album."
      min_trust_level_required: "You must reach Trust Level %{level} to use the photo album feature."
      album_not_found: "Album not found."
      item_not_found: "Image item not found."
      album_limit_reached: "You have reached your maximum limit of %{limit} albums."
      album_depth_exceeded: "Sub-album hierarchy cannot exceed %{max_depth} levels."
      album_quota_exceeded: "This album has reached its maximum capacity of %{limit} images."
      user_quota_exceeded: "You have reached your maximum quota of %{limit} images across all albums."
      disk_quota_exceeded: "You have exceeded your total storage quota of %{limit} MB."
      download_disabled: "Whole album downloading is currently disabled by administrator configuration."
      no_valid_images: "No valid image data or upload ID provided."
      target_album_invalid: "The selected target album is invalid or does not belong to you."
      bulk_limit_exceeded: "Cannot process more than %{limit} images in a single bulk operation."
      cannot_move_into_self: "An album cannot be moved inside itself or one of its descendants."
